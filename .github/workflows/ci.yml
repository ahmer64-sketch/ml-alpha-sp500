name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - run: pytest -q

  reproduce:
    # Regenerates every report and figure from the committed snapshot (no network).
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: the hold-out guard compares src/alpha with the frozen commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: make all
      - uses: actions/upload-artifact@v4
        with:
          name: reports-and-figures
          path: |
            reports/
            figures/
