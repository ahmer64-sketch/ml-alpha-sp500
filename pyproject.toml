[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha"
version = "0.1.0"
description = "Leakage-safe machine-learning alpha signal on US equities"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pandas", "pyarrow", "scikit-learn", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
